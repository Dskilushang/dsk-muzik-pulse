<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Divulgation | DSK Muzik Pulse</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --noir: #0A0A0B; --carte: #151518; --jaune: #FFD700; --rouge: #FF0033; --blanc: #FFF; --gris: #A0A0A5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--noir); color: var(--blanc); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .form-box { background: var(--carte); padding: 40px; border-radius: 20px; width: 100%; max-width: 500px; border: 1px solid rgba(255,255,255,0.1); }
        .form-box h2 { text-align: center; margin-bottom: 20px; }
        .form-box h2 span { color: var(--jaune); }
        
        .campo-grupo { margin-bottom: 20px; }
        .campo-grupo label { display: block; font-size: 13px; color: var(--gris); margin-bottom: 8px; font-weight: 600; }
        .campo-grupo input, .campo-grupo select { width: 100%; padding: 14px; background: var(--noir); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--blanc); font-size: 15px; outline: none; }
        .campo-grupo input:focus, .campo-grupo select:focus { border-color: var(--jaune); }
        
        .area-upload { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
        .area-upload:hover { border-color: var(--jaune); background: rgba(255, 215, 0, 0.05); }
        .area-upload input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .area-upload i { font-size: 40px; color: var(--jaune); margin-bottom: 10px; display: block; }
        .area-upload p { font-size: 14px; font-weight: 600; }
        .area-upload span { font-size: 12px; color: var(--gris); }

        .btn { width: 100%; padding: 16px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; border: none; background: var(--rouge); color: var(--blanc); margin-top: 10px; transition: 0.3s; }
        .btn:hover { box-shadow: 0 0 20px rgba(255, 0, 51, 0.6); transform: translateY(-2px); }

        .voltar { display: block; text-align: center; margin-top: 20px; color: var(--gris); font-size: 13px; text-decoration: none; }
        .voltar:hover { color: var(--blanc); }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Nouvelle <span>Divulgation</span></h2>
        
        <form id="formDivulgacao" onsubmit="enviarMusica(event)">
            <!-- Fichier Audio -->
            <div class="campo-grupo">
                <label>Fichier Audio (MP3/WAV) *</label>
                <div class="area-upload">
                    <input type="file" id="audioFile" accept=".mp3, .wav, .m4a" required onchange="mostrarNomeArquivo(this)">
                    <i class="bi bi-cloud-arrow-up"></i>
                    <p id="audioNome">Cliquez pour choisir votre musique</p>
                    <span>MP3, WAV ou M4A (max 50MB)</span>
                </div>
            </div>

            <!-- Image de couverture -->
            <div class="campo-grupo">
                <label>Image de couverture (JPG/PNG)</label>
                <div class="area-upload">
                    <input type="file" id="capaFile" accept="image/*" onchange="mostrarNomeCapa(this)">
                    <i class="bi bi-image"></i>
                    <p id="capaNome">Cliquez pour ajouter une image</p>
                </div>
            </div>

            <!-- Nom de la musique -->
            <div class="campo-grupo">
                <label>Nom de la musique *</label>
                <input type="text" id="nomeMusica" placeholder="Ex: Noites de Verão" required>
            </div>

            <!-- Nom de l'artiste -->
            <div class="campo-grupo">
                <label>Nom de l'artiste *</label>
                <input type="text" id="nomeArtista" placeholder="Ex: Daniel Kilusisa" required>
            </div>

            <!-- Genre -->
            <div class="campo-grupo">
                <label>Genre Musical *</label>
                <select id="genero" required>
                    <option value="">Sélectionnez un genre</option>
                    <option>Kizomba</option>
                    <option>Kuduro</option>
                    <option>Semba</option>
                    <option>Afro House</option>
                    <option>Rap</option>
                    <option>Gospel</option>
                    <option>Trap</option>
                    <option>R&B</option>
                </select>
            </div>

            <button type="submit" class="btn">Envoyer la Musique</button>
        </form>
        
        <a href="minha-conta.html" class="voltar">← Retour au tableau de bord</a>
    </div>

    <script>
        function mostrarNomeArquivo(input) {
            if (input.files && input.files[0]) {
                document.getElementById('audioNome').textContent = input.files[0].name;
            }
        }
        function mostrarNomeCapa(input) {
            if (input.files && input.files[0]) {
                document.getElementById('capaNome').textContent = input.files[0].name;
            }
        }

        function enviarMusica(e) {
            e.preventDefault(); // Empêche le rechargement de la page
            // Pour l'instant, on simule l'envoi avec une alerte
            alert("Musique envoyée avec succès ! (Simulation)\n\nDans la prochaine étape, nous l'enverrons vraiment sur Firebase Storage.");
            window.location.href = 'minha-conta.html';
        }
    </script>
    
    <!-- Bootstrap Icons pour les icônes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</body>
  </html>
