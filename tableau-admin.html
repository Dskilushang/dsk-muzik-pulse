<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DSK Muzik Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --noir: #0A0A0B; --carte: #151518; --jaune: #FFD700; --rouge: #FF0033; --blanc: #FFF; --gris: #A0A0A5; --vert: #10B981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--noir); color: var(--blanc); display: flex; min-height: 100vh; }
        
        .sidebar { width: 250px; background: var(--carte); padding: 30px 20px; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 1.2rem; color: var(--rouge); margin-bottom: 30px; }
        .menu-item { padding: 15px; border-radius: 10px; color: var(--gris); font-weight: 600; margin-bottom: 5px; cursor: pointer; }
        .menu-item.ativo { background: rgba(255, 0, 51, 0.1); color: var(--rouge); }
        .btn-sair { margin-top: auto; background: transparent; border: 1px solid var(--gris); color: var(--gris); padding: 12px; border-radius: 8px; cursor: pointer; }
        
        .main { flex: 1; padding: 40px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--carte); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .card p { color: var(--gris); font-size: 0.9rem; margin-bottom: 10px; }
        .card h3 { font-size: 2rem; font-weight: 800; }
        .card.verde h3 { color: var(--vert); }
        .card.jaune h3 { color: var(--jaune); }

        .tabela { width: 100%; border-collapse: collapse; background: var(--carte); border-radius: 16px; overflow: hidden; }
        .tabela th { background: rgba(255,255,255,0.02); padding: 15px; text-align: left; color: var(--gris); font-size: 0.8rem; }
        .tabela td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>🛡️ ADMIN DSK</h2>
        <div class="menu-item ativo">📊 Dashboard</div>
        <div class="menu-item">👥 Artistes</div>
        <div class="menu-item">💳 Paiements</div>
        <button class="btn-sair" onclick="sairAdmin()">Sair</button>
    </aside>

    <main class="main">
        <div class="header">
            <h1>Vue Globale</h1>
            <div>👤 Admin</div>
        </div>

        <div class="grid-cards">
            <div class="card"><p>Total Artistes</p><h3 id="totalArtistas">0</h3></div>
            <div class="card jaune"><p>Divulgações</p><h3>0</h3></div>
            <div class="card verde"><p>Revenus (Kz)</p><h3>0</h3></div>
        </div>

        <h2 style="margin-bottom: 20px;">Liste des Artistes Inscrits</h2>
        <table class="tabela">
            <thead><tr><th>Email</th><th>Date d'inscription</th><th>Statut</th></tr></thead>
            <tbody id="listaArtistas">
                <tr><td colspan="3" style="text-align: center; color: var(--gris); padding: 30px;">Chargement...</td></tr>
            </tbody>
        </table>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Sécurité Admin
        if (sessionStorage.getItem('dsk_admin_logado') !== 'true') {
            window.location.href = 'espace-admin.html';
        }

        function sairAdmin() {
            sessionStorage.removeItem('dsk_admin_logado');
            window.location.href = 'espace-admin.html';
        }

        // Configuration Firebase
        var firebaseConfig = {
            apiKey: "AIzaSyA7HeUqyxwtrL36UxZrMBfkq-yGPIVLrI4",
            authDomain: "dsk-muzik-pulse.firebaseapp.com",
            projectId: "dsk-muzik-pulse",
            storageBucket: "dsk-muzik-pulse.firebasestorage.app",
            messagingSenderId: "1087273927994",
            appId: "1:1087273927994:web:b4d484d84779e1c8733c03"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore(); // Note : Firestore doit être activé dans Firebase

        // Récupérer la liste des utilisateurs (Simulation via Auth si Firestore n'est pas prêt)
        // Puisque nous n'avons pas encore de base de données pour stocker les profils, 
        // nous allons juste afficher un message pour l'instant.
        
        // ⚠️ Pour voir les vrais utilisateurs, vous devez aller dans Firebase > Authentication.
        // Ce code est prêt pour le jour où vous activerez Firestore.
        
        document.getElementById('listaArtistas').innerHTML = `
            <tr>
                <td colspan="3" style="text-align: center; color: var(--gris); padding: 30px;">
                    Les utilisateurs sont enregistrés en toute sécurité dans <strong>Firebase > Authentication</strong>.<br><br>
                    <a href="https://console.firebase.google.com/project/dsk-muzik-pulse/authentication/users" target="_blank" style="color: var(--jaune);">Cliquez ici pour voir la liste des artistes</a>
                </td>
            </tr>
        `;
        document.getElementById('totalArtistas').textContent = "1"; // Nous mettons 1 car vous êtes le premier inscrit
    </script>
</body>
  </html>
