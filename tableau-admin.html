<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DSK Muzik Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --noir: #0A0A0B; --carte: #151518; --jaune: #FFD700; --rouge: #FF0033; --blanc: #FFF; --gris: #A0A0A5; --vert: #10B981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--noir); color: var(--blanc); display: flex; min-height: 100vh; }
        
        .sidebar { width: 250px; background: var(--carte); padding: 30px 20px; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 1.2rem; color: var(--rouge); margin-bottom: 30px; }
        .menu-item { padding: 15px; border-radius: 10px; color: var(--gris); font-weight: 600; margin-bottom: 5px; cursor: pointer; }
        .menu-item.ativo { background: rgba(255, 0, 51, 0.1); color: var(--rouge); }
        .btn-sair { margin-top: auto; background: transparent; border: 1px solid var(--gris); color: var(--gris); padding: 12px; border-radius: 8px; cursor: pointer; }
        .btn-sair:hover { border-color: var(--rouge); color: var(--rouge); }
        
        .main { flex: 1; padding: 40px; overflow-x: auto; }
        .header { display: flex; justify-content: space-between; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--carte); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .card p { color: var(--gris); font-size: 0.9rem; margin-bottom: 10px; }
        .card h3 { font-size: 2rem; font-weight: 800; }
        .card.verde h3 { color: var(--vert); }
        .card.jaune h3 { color: var(--jaune); }

        h2.secao-titulo { font-size: 1.3rem; margin-bottom: 15px; margin-top: 30px; color: var(--blanc); }
        
        .tabela { width: 100%; border-collapse: collapse; background: var(--carte); border-radius: 16px; overflow: hidden; margin-bottom: 30px; font-size: 13px; }
        .tabela th { background: rgba(255,255,255,0.02); padding: 15px; text-align: left; color: var(--gris); font-size: 0.75rem; text-transform: uppercase; }
        .tabela td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        /* Miniatures et Lecteur */
        .mini-capa { width: 40px; height: 40px; border-radius: 8px; background: #222; object-fit: cover; }
        .player-mini { height: 30px; width: 200px; }
        
        .btn-acao { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; margin-right: 5px; color: #fff; }
        .btn-aprovar { background: var(--vert); }
        .btn-rejeitar { background: var(--rouge); }
        .btn-validar { background: var(--jaune); color: var(--noir); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>🛡️ ADMIN DSK</h2>
        <div class="menu-item ativo">📊 Dashboard</div>
        <div class="menu-item">👥 Artistes & Divulgações</div>
        <button class="btn-sair" onclick="sairAdmin()">Sair</button>
    </aside>

    <main class="main">
        <div class="header">
            <h1>Vue Globale</h1>
            <div>👤 Admin</div>
        </div>

        <div class="grid-cards">
            <div class="card"><p>Total Artistes</p><h3 id="totalArtistas">0</h3></div>
            <div class="card jaune"><p>Divulgações</p><h3 id="totalDivulgacoes">0</h3></div>
            <div class="card verde"><p>Revenus (Kz)</p><h3>0</h3></div>
        </div>

        <!-- TABLEAU DES ARTISTES -->
        <h2 class="secao-titulo">💰 Demandes de Paiement (Artistes)</h2>
        <table class="tabela">
            <thead>
                <tr><th>Email Artiste</th><th>Plan</th><th>Statut</th><th>Actions</th></tr>
            </thead>
            <tbody id="tabelaArtistas">
                <tr><td colspan="4" style="text-align: center; padding: 30px;">Chargement...</td></tr>
            </tbody>
        </table>

        <!-- TABLEAU DES DIVULGAÇÕES AVEC LECTEUR -->
        <h2 class="secao-titulo">🎵 Validation des Musiques</h2>
        <table class="tabela">
            <thead>
                <tr><th>Aperçu</th><th>Musique</th><th>Artiste</th><th>Statut</th><th>Actions</th></tr>
            </thead>
            <tbody id="tabelaDivulgacoes">
                <tr><td colspan="5" style="text-align: center; padding: 30px;">Chargement...</td></tr>
            </tbody>
        </table>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        if (sessionStorage.getItem('dsk_admin_logado') !== 'true') {
            window.location.href = 'espace-admin.html';
        }

        function sairAdmin() {
            sessionStorage.removeItem('dsk_admin_logado');
            window.location.href = 'espace-admin.html';
        }

        var firebaseConfig = {
            apiKey: "AIzaSyA7HeUqyxwtrL36UxZrMBfkq-yGPIVLrI4",
            authDomain: "dsk-muzik-pulse.firebaseapp.com",
            projectId: "dsk-muzik-pulse",
            storageBucket: "dsk-muzik-pulse.firebasestorage.app",
            messagingSenderId: "1087273927994",
            appId: "1:1087273927994:web:b4d484d84779e1c8733c03"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // 1. CHARGER LES ARTISTES
        db.collection("artistes").get().then((querySnapshot) => {
            document.getElementById('totalArtistas').textContent = querySnapshot.size;
            let html = '';
            if (querySnapshot.empty) {
                html = '<tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--gris);">Aucun artiste inscrit.</td></tr>';
            } else {
                querySnapshot.forEach((doc) => {
                    let a = doc.data();
                    let plano = a.plano || "Start";
                    let statusPag = a.statusPagamento || "Aucun paiement";
                    let corStatus = statusPag === 'Payé' ? 'var(--vert)' : 'var(--jaune)';
                    
                    html += `
                        <tr>
                            <td>${a.email}</td>
                            <td><strong style="color:var(--jaune);">${plano}</strong></td>
                            <td><span style="color: ${corStatus}; font-weight: bold;">${statusPag}</span></td>
                            <td>
                                ${statusPag !== 'Payé' ? `<button class="btn-acao btn-validar" onclick="validarPagamento('${doc.id}', '${plano}')">Valider</button>` : '<span style="color:var(--vert);">✓ Validé</span>'}
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById('tabelaArtistas').innerHTML = html;
        });

        // 2. CHARGER LES DIVULGAÇÕES (AVEC IMAGE ET AUDIO)
        db.collection("divulgacoes").get().then((querySnapshot) => {
            document.getElementById('totalDivulgacoes').textContent = querySnapshot.size;
            
            let html = '';
            if (querySnapshot.empty) {
                html = '<tr><td colspan="5" style="text-align: center; padding: 30px; color: var(--gris);">Aucune musique envoyée.</td></tr>';
            } else {
                querySnapshot.forEach((doc) => {
                    let m = doc.data();
                    let corStatus = m.status === 'Approuvé' ? 'var(--vert)' : (m.status === 'Rejeté' ? 'var(--rouge)' : 'var(--jaune)');
                    
                    // Aperçu (Image ou icône par défaut)
                    let imgCapa = m.capaUrl ? `<img src="${m.capaUrl}" class="mini-capa">` : `<div class="mini-capa" style="display:flex; justify-content:center; align-items:center;"><i class="bi bi-music-note"></i></div>`;
                    
                    // Lecteur Audio
                    let audioUrl = m.audioUrl || "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
                    let player = `<audio controls class="player-mini" style="width: 150px;"><source src="${audioUrl}" type="audio/mpeg"></audio>`;

                    html += `
                        <tr>
                            <td>${imgCapa} ${player}</td>
                            <td><strong>${m.titulo}</strong><br><span style="color:var(--gris); font-size:11px;">${m.genero}</span></td>
                            <td>${m.artista}</td>
                            <td><span style="color: ${corStatus}; font-weight: bold;">${m.status}</span></td>
                            <td>
                                <button class="btn-acao btn-aprovar" onclick="mudarStatus('${doc.id}', 'Approuvé')">Approuver</button>
                                <button class="btn-acao btn-rejeitar" onclick="mudarStatus('${doc.id}', 'Rejeté')">Rejeter</button>
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById('tabelaDivulgacoes').innerHTML = html;
        });

        // 3. VALIDER UN PAIEMENT
        function validarPagamento(idArtista, plano) {
            if(confirm("Avez-vous bien reçu le paiement pour le plan " + plano + " ?")) {
                db.collection("artistes").doc(idArtista).update({ statusPagamento: "Payé" }).then(() => {
                    alert("Paiement validé !");
                    window.location.reload();
                });
            }
        }

        // 4. APPROUVER / REJETER UNE MUSIQUE
        function mudarStatus(idDoc, novoStatus) {
            db.collection("divulgacoes").doc(idDoc).update({ status: novoStatus }).then(() => {
                window.location.reload(); 
            });
        }
    </script>
</body>
</html>
