<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | DSK Muzik Pulse</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --noir-profond: #0A0A0B; --noir-carte: #151518; --jaune-neon: #FFD700; --rouge-neon: #FF0033; --blanc: #FFFFFF; --gris-texte: #A0A0A5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--noir-profond) !important; color: var(--blanc) !important; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: radial-gradient(circle at top right, rgba(255, 0, 51, 0.1) 0%, transparent 40%), radial-gradient(circle at bottom left, rgba(255, 215, 0, 0.05) 0%, transparent 40%); }
        a { text-decoration: none; color: inherit; }
        
        .auth-container { background-color: var(--noir-carte); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); position: relative; }
        .logo-top { text-align: center; margin-bottom: 30px; }
        .logo-top img { height: 80px; margin-bottom: 10px; }
        
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .tab { flex: 1; padding: 15px; text-align: center; font-weight: 600; cursor: pointer; color: var(--gris-texte); border-bottom: 2px solid transparent; transition: all 0.3s ease; }
        .tab.ativo { color: var(--blanc); border-bottom: 2px solid var(--rouge-neon); }
        
        .formulario { display: none; }
        .formulario.ativo { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .campo-grupo { margin-bottom: 20px; }
        .campo-grupo label { display: block; font-size: 13px; color: var(--gris-texte); margin-bottom: 8px; }
        .campo-grupo input { width: 100%; padding: 14px; background: var(--noir-profond); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: var(--blanc); font-size: 15px; outline: none; transition: border 0.3s; }
        .campo-grupo input:focus { border-color: var(--jaune-neon); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        .btn { width: 100%; padding: 15px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; border: none; transition: all 0.3s ease; margin-top: 10px; }
        .btn-jaune { background-color: var(--jaune-neon); color: var(--noir-profond); }
        .btn-jaune:hover { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); transform: translateY(-2px); }
        .btn-rouge { background-color: var(--rouge-neon); color: var(--blanc); }
        .btn-rouge:hover { box-shadow: 0 0 20px rgba(255, 0, 51, 0.6); transform: translateY(-2px); }
        
        .voltar-link { display: block; text-align: center; margin-top: 25px; font-size: 13px; color: var(--gris-texte); transition: color 0.3s; }
        .voltar-link:hover { color: var(--blanc); }
        
        /* Message d'erreur/succès */
        .mensagem { text-align: center; font-size: 13px; margin-top: 15px; display: none; }
        .mensagem.erro { color: var(--rouge-neon); display: block; }
        .mensagem.sucesso { color: #10B981; display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-top">
            <img src="assets/images/logo-header.png" alt="DSK Muzik Pulse">
        </div>

        <div class="tabs">
            <div class="tab ativo" onclick="mudarTab('login')">Connexion</div>
            <div class="tab" onclick="mudarTab('cadastro')">Inscription</div>
        </div>

        <!-- Formulaire de Connexion -->
        <div id="form-login" class="formulario ativo">
            <div class="campo-grupo">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com">
            </div>
            <div class="campo-grupo">
                <label>Mot de passe</label>
                <input type="password" id="loginSenha" placeholder="••••••••">
            </div>
            <button class="btn btn-jaune" onclick="fazerLogin()">Se connecter</button>
            <div id="msgLogin" class="mensagem"></div>
        </div>

        <!-- Formulaire d'Inscription -->
        <div id="form-cadastro" class="formulario">
            <div class="campo-grupo">
                <label>Nom complet</label>
                <input type="text" id="cadNome" placeholder="Votre nom d'artiste">
            </div>
            <div class="campo-grupo">
                <label>E-mail</label>
                <input type="email" id="cadEmail" placeholder="seu@email.com">
            </div>
            <div class="campo-grupo">
                <label>Mot de passe</label>
                <input type="password" id="cadSenha" placeholder="Créez un mot de passe sécurisé">
            </div>
            <button class="btn btn-rouge" onclick="fazerCadastro()">Créer mon compte</button>
            <div id="msgCadastro" class="mensagem"></div>
        </div>

        <a href="index.html" class="voltar-link">← Retour à l'accueil</a>
    </div>

    <!-- 1. On charge Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 2. Vos vraies clés Firebase (copiées de votre capture)
        const firebaseConfig = {
            apiKey: "AIzaSyA7HeUqywxtrl36UxZrMBfkv-yGPIVLrI4",
            authDomain: "dsk-muzik-pulse.firebaseapp.com",
            projectId: "dsk-muzik-pulse",
            storageBucket: "dsk-muzik-pulse.firebasestorage.app",
            messagingSenderId: "1087273927994",
            appId: "1:1087273927994:web:b4d484d84779e1c8733c03",
            measurementId: "G-JJ6NNE8NK2"
        };

        // 3. On initialise Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 4. Les fonctions de connexion et d'inscription
        window.fazerLogin = function() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const msg = document.getElementById('msgLogin');

            signInWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    msg.className = 'mensagem sucesso';
                    msg.textContent = "Connexion réussie ! Redirection...";
                    // On sauvegarde l'email pour la page suivante
                    localStorage.setItem('dsk_nome_artista', userCredential.user.email);
                    setTimeout(() => { window.location.href = 'minha-conta.html'; }, 1500);
                })
                .catch((error) => {
                    msg.className = 'mensagem erro';
                    msg.textContent = "Erreur : Email ou mot de passe incorrect.";
                });
        };

        window.fazerCadastro = function() {
            const nome = document.getElementById('cadNome').value;
            const email = document.getElementById('cadEmail').value;
            const senha = document.getElementById('cadSenha').value;
            const msg = document.getElementById('msgCadastro');

            createUserWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    msg.className = 'mensagem sucesso';
                    msg.textContent = "Compte créé avec succès !";
                    localStorage.setItem('dsk_nome_artista', nome); // On sauvegarde le nom
                    setTimeout(() => { window.location.href = 'minha-conta.html'; }, 1500);
                })
                .catch((error) => {
                    msg.className = 'mensagem erro';
                    msg.textContent = "Erreur : " + (error.code === 'auth/email-already-in-use' ? "Cet email est déjà utilisé." : "Mot de passe trop faible (6 caractères min).");
                });
        };

        // Fonction pour changer d'onglet (Connexion/Inscription)
        window.mudarTab = function(tipo) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('ativo'));
            document.querySelectorAll('.formulario').forEach(form => form.classList.remove('ativo'));
            if (tipo === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('ativo');
                document.getElementById('form-login').classList.add('ativo');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('ativo');
                document.getElementById('form-cadastro').classList.add('ativo');
            }
        };
    </script>
</body>
</html>
