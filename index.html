<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firebase</title>
    <style>
        body { background-color: #0A0A0B; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        button { padding: 15px 30px; font-size: 18px; background: #FFD700; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #resultado { margin-top: 30px; font-size: 16px; padding: 20px; border-radius: 10px; }
        .sucesso { background: #10B981; color: white; }
        .erro { background: #FF0033; color: white; }
    </style>
</head>
<body>
    <h1>Test de connexion Firebase</h1>
    <p>Cliquez sur le bouton pour tester.</p>
    <button onclick="testarCadastro()">Tester la création de compte</button>
    <div id="resultado"></div>

    <!-- Firebase v8 (plus stable) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Vos clés
        var firebaseConfig = {
            apiKey: "AIzaSyA7HeUqywxtrl36UxZrMBfkv-yGPIVLrI4",
            authDomain: "dsk-muzik-pulse.firebaseapp.com",
            projectId: "dsk-muzik-pulse",
            storageBucket: "dsk-muzik-pulse.firebasestorage.app",
            messagingSenderId: "1087273927994",
            appId: "1:1087273927994:web:b4d484d84779e1c8733c03"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();

        function testarCadastro() {
            var res = document.getElementById('resultado');
            res.className = '';
            res.innerHTML = '⏳ Envoi de la requête à Firebase...';

            // On essaie de créer un compte de test
            auth.createUserWithEmailAndPassword("test1234@dskmuzikpulse.com", "123456")
                .then(function(user) {
                    res.className = 'sucesso';
                    res.innerHTML = '✅ SUCCÈS ! Firebase a répondu. Le compte ' + user.user.email + ' a été créé.';
                })
                .catch(function(error) {
                    res.className = 'erro';
                    res.innerHTML = '❌ ERREUR : ' + error.code + '<br>' + error.message;
                });
        }
    </script>
</body>
</html>
