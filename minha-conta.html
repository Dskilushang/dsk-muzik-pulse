<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte | DSK Muzik Pulse</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --noir: #0A0A0B; --carte: #151518; --jaune: #FFD700; --rouge: #FF0033; --blanc: #FFF; --gris: #A0A0A5; --vert: #10B981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--noir); color: var(--blanc); display: flex; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* Sidebar */
        .sidebar { width: 250px; background-color: var(--carte); padding: 30px 20px; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .sidebar-logo img { height: 40px; margin-bottom: 40px; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 10px; color: var(--gris); font-weight: 600; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .menu-item:hover, .menu-item.ativo { background-color: rgba(255, 215, 0, 0.1); color: var(--jaune); }
        .btn-sair { margin-top: auto; background: transparent; border: 1px solid var(--rouge); color: var(--rouge); padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-sair:hover { background: var(--rouge); color: var(--blanc); }

        /* Main */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-conta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-conta h1 { font-size: 1.8rem; }
        .header-conta h1 span { color: var(--jaune); }
        .avatar-user { width: 50px; height: 50px; border-radius: 50%; background: var(--rouge); display: flex; justify-content: center; align-items: center; font-weight: 800; }

        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card-stat { background-color: var(--carte); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .card-stat p { color: var(--gris); font-size: 0.9rem; margin-bottom: 10px; }
        .card-stat h3 { font-size: 2rem; font-weight: 800; color: var(--blanc); }
        .card-stat.destaque h3 { color: var(--vert); }

        .section-titulo { font-size: 1.3rem; margin-bottom: 20px; }
        .tabela-container { background: var(--carte); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,255,255,0.02); padding: 15px; color: var(--gris); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 20px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .sidebar-logo img { height: 30px; margin-bottom: 20px; }
            .main-content { padding: 20px; }
            .header-conta { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/logo-header.png" alt="DSK Muzik Pulse">
        </div>
        <div class="menu-item ativo">📊 Tableau de bord</div>
        <div class="menu-item">🎵 Mes Divulgations</div>
        <div class="menu-item">💰 Mon Portefeuille</div>
        <div class="menu-item">⚙️ Paramètres</div>
        <button class="btn-sair" onclick="sair()">Se déconnecter</button>
    </aside>

    <main class="main-content">
        <div class="header-conta">
            <h1>Bonjour, <span id="nomeArtista">Artiste</span> 👋</h1>
            <div class="avatar-user" id="avatarUser">DSK</div>
        </div>

        <div class="grid-stats">
            <div class="card-stat">
                <p>Vues totales</p>
                <h3>0</h3>
            </div>
            <div class="card-stat destaque">
                <p>Solde disponible</p>
                <h3>0,00 Kz</h3>
            </div>
            <div class="card-stat">
                <p>Téléchargements</p>
                <h3>0</h3>
            </div>
            <div class="card-stat">
                <p>Musiques actives</p>
                <h3>0</h3>
            </div>
        </div>

        <h2 class="section-titulo">Mes dernières divulgations</h2>
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Musique</th>
                        <th>Plan</th>
                        <th>Statut</th>
                        <th>Vues</th>
                        <th>Gains</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--gris); padding: 30px;">
                            Vous n'avez pas encore de musique. <br><br>
                            <a href="index.html#plans" style="color: var(--jaune); font-weight: bold;">Choisir un plan</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Firebase pour vérifier la session -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Vos clés Firebase exactes
        var firebaseConfig = {
            apiKey: "AIzaSyA7HeUqyxwtrL36UxZrMBfkq-yGPIVLrI4",
            authDomain: "dsk-muzik-pulse.firebaseapp.com",
            projectId: "dsk-muzik-pulse",
            storageBucket: "dsk-muzik-pulse.firebasestorage.app",
            messagingSenderId: "1087273927994",
            appId: "1:1087273927994:web:b4d484d84779e1c8733c03"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();

        // Vérifier si l'utilisateur est connecté
        auth.onAuthStateChanged(function(user) {
            if (user) {
                // L'utilisateur est connecté
                var email = user.email;
                var nome = email.split('@')[0]; // Prend la partie avant le @
                
                document.getElementById('nomeArtista').textContent = nome;
                document.getElementById('avatarUser').textContent = nome.substring(0, 2).toUpperCase();
            } else {
                // Personne n'est connecté : on redirige vers la page de connexion
                window.location.href = 'login.html';
            }
        });

        // Fonction de déconnexion
        function sair() {
            auth.signOut().then(function() {
                // Déconnexion réussie, on redirige vers l'accueil
                window.location.href = 'index.html';
            }).catch(function(error) {
                alert("Erreur lors de la déconnexion.");
            });
        }
    </script>
</body>
</html>
