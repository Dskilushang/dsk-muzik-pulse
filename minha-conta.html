<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte | DSK Muzik Pulse</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --noir-profond: #0A0A0B;
            --noir-carte: #151518;
            --jaune-neon: #FFD700;
            --rouge-neon: #FF0033;
            --blanc: #FFFFFF;
            --gris-texte: #A0A0A5;
            --vert: #10B981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--noir-profond); color: var(--blanc); display: flex; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* --- MENU LATÉRAL (SIDEBAR) --- */
        .sidebar {
            width: 250px; background-color: var(--noir-carte); padding: 30px 20px;
            border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
        }
        .sidebar-logo img { height: 40px; margin-bottom: 40px; }
        
        .menu-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            border-radius: 10px; color: var(--gris-texte); font-weight: 600;
            margin-bottom: 10px; cursor: pointer; transition: all 0.3s;
        }
        .menu-item:hover, .menu-item.ativo {
            background-color: rgba(255, 215, 0, 0.1); color: var(--jaune-neon);
        }
        
        .btn-sair {
            margin-top: auto; background: transparent; border: 1px solid var(--rouge-neon);
            color: var(--rouge-neon); padding: 12px; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .btn-sair:hover { background: var(--rouge-neon); color: var(--blanc); }

        /* --- CONTENU PRINCIPAL --- */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        
        .header-conta {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-conta h1 { font-size: 1.8rem; }
        .header-conta h1 span { color: var(--jaune-neon); }
        .avatar-user {
            width: 50px; height: 50px; border-radius: 50%; background: var(--rouge-neon);
            display: flex; justify-content: center; align-items: center; font-weight: 800;
        }

        /* --- CARTES DE STATISTIQUES --- */
        .grid-stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .card-stat {
            background-color: var(--noir-carte); padding: 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-stat p { color: var(--gris-texte); font-size: 0.9rem; margin-bottom: 10px; }
        .card-stat h3 { font-size: 2rem; font-weight: 800; color: var(--blanc); }
        .card-stat.destaque h3 { color: var(--vert); }

        /* --- TABLEAU DES DIVULGATIONS --- */
        .section-titulo { font-size: 1.3rem; margin-bottom: 20px; }
        .tabela-container {
            background: var(--noir-carte); border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,255,255,0.02); padding: 15px; color: var(--gris-texte); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .badge-ativo { background: rgba(16, 185, 129, 0.2); color: var(--vert); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        /* --- RESPONSIVE (TÉLÉPHONE) --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 20px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .sidebar-logo img { height: 30px; margin-bottom: 20px; }
            .main-content { padding: 20px; }
            .header-conta { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- MENU LATÉRAL -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/logo-header.png" alt="DSK Muzik Pulse">
        </div>
        <div class="menu-item ativo">📊 Tableau de bord</div>
        <div class="menu-item">🎵 Mes Divulgations</div>
        <div class="menu-item">💰 Mon Portefeuille</div>
        <div class="menu-item">⚙️ Paramètres</div>
        <button class="btn-sair" onclick="sair()">Se déconnecter</button>
    </aside>

    <!-- CONTENU -->
    <main class="main-content">
        <div class="header-conta">
            <h1>Bonjour, <span id="nomeArtista">Artiste</span> 👋</h1>
            <div class="avatar-user">DSK</div>
        </div>

        <!-- STATISTIQUES -->
        <div class="grid-stats">
            <div class="card-stat">
                <p>Vues totales</p>
                <h3>0</h3>
            </div>
            <div class="card-stat destaque">
                <p>Solde disponible</p>
                <h3>0,00 Kz</h3>
            </div>
            <div class="card-stat">
                <p>Téléchargements</p>
                <h3>0</h3>
            </div>
            <div class="card-stat">
                <p>Musiques actives</p>
                <h3>0</h3>
            </div>
        </div>

        <!-- SECTION DIVULGATIONS -->
        <h2 class="section-titulo">Mes dernières divulgations</h2>
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Musique</th>
                        <th>Plan</th>
                        <th>Statut</th>
                        <th>Vues</th>
                        <th>Gains</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--gris-texte); padding: 30px;">
                            Vous n'avez pas encore de musique. <br><br>
                            <a href="index.html#plans" style="color: var(--jaune-neon); font-weight: bold;">Choisir un plan</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Simulation : On récupère le nom stocké lors de l'inscription (s'il existe)
        const nome = localStorage.getItem('dsk_nome_artista');
        if (nome) {
            document.getElementById('nomeArtista').textContent = nome;
        }

        function sair() {
            localStorage.removeItem('dsk_nome_artista');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
